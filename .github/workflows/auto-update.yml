name: Auto Update from Upstream
on:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync from Upstream
        id: sync
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/openclaw/openclaw.git
          git fetch upstream

          # Check if we're already up to date
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Attempt rebase; if it conflicts, auto-resolve using our fork's versions
          # for files we own, then continue.
          if git rebase upstream/main; then
            git push -f origin main
            echo "success=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rebase hit conflicts — auto-resolve known fork-owned files using ours,
          # then continue stepping through the remaining commits.
          MAX_ROUNDS=40
          ROUND=0
          while [ $ROUND -lt $MAX_ROUNDS ]; do
            ROUND=$((ROUND + 1))
            CONFLICTED=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -z "$CONFLICTED" ]; then
              break
            fi

            for f in $CONFLICTED; do
              case "$f" in
                # Fork-owned files: always keep our version
                .github/workflows/*|entrypoint.sh|Dockerfile|railway.toml|railway.json|scripts/docker/*)
                  git checkout --ours "$f" || git rm "$f"
                  git add "$f" 2>/dev/null || true
                  ;;
                # For everything else, prefer our version but flag it
                *)
                  git checkout --ours "$f" || git rm "$f"
                  git add "$f" 2>/dev/null || true
                  echo "auto-resolved (ours): $f" >&2
                  ;;
              esac
            done

            if GIT_EDITOR=true git rebase --continue 2>/dev/null; then
              :  # stepped to next commit cleanly
            else
              # Next commit also has conflicts — loop will handle them
              :
            fi

            # Check if rebase finished
            if ! test -d .git/rebase-merge && ! test -d .git/rebase-apply; then
              break
            fi
          done

          if test -d .git/rebase-merge || test -d .git/rebase-apply; then
            # Still in rebase after max rounds — give up
            git rebase --abort
            UPSTREAM_SHA=$(git rev-parse upstream/main)
            echo "conflicts=rebase-stuck" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          git push -f origin main
          echo "success=true" >> "$GITHUB_OUTPUT"

      - name: Open issue on conflict
        if: failure() && steps.sync.outputs.conflicts != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_SHA="${{ steps.sync.outputs.upstream_sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --label "sync-conflict" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Sync conflict still unresolved (upstream \`${UPSTREAM_SHA:0:10}\`). [Failed run]($RUN_URL)"
          else
            BODY="The nightly upstream sync failed after auto-resolution attempts.\n\nUpstream SHA: ${UPSTREAM_SHA:0:10}\n\nFailed run: $RUN_URL\n\nTo fix locally: git fetch upstream && git rebase upstream/main, resolve conflicts, then git push -f origin main"
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "Upstream sync conflict — manual rebase required" \
              --label "sync-conflict" \
              --body "$BODY"
          fi
