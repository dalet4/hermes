name: Auto Update from Upstream
on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Sync from Upstream
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/openclaw/openclaw.git
          git fetch upstream
          # Use rebase to keep local Railway fixes on top of upstream changes
          git rebase upstream/main || (git rebase --abort && echo 'Rebase conflicts detected. Manual intervention required.' && exit 1)
          git push -f origin main
