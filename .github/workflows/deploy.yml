name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /opt/hermes
            git pull origin main
            if [ -d /opt/hermes-src ]; then git -C /opt/hermes-src pull; else git clone https://github.com/NousResearch/hermes-agent.git /opt/hermes-src; fi
            docker compose -f docker-compose.prod.yml build hermes
            docker compose -f docker-compose.prod.yml pull n8n caddy
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
