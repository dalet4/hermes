services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hermes
      - n8n

  hermes:
    build: .
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OPENCLAW_BIND_LAN: "1"
      TZ: Europe/London
    volumes:
      - hermes-data:/home/node/.openclaw

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.aigentic-ai.co.uk
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.aigentic-ai.co.uk/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Europe/London
      TZ: Europe/London
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  hermes-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/hermes/openclaw-data
  n8n-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/hermes/n8n
  caddy-data:
  caddy-config:
