services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - openclaw-gateway
      - n8n

  openclaw-gateway:
    image: ghcr.io/dalet4/openclaw:latest
    restart: unless-stopped
    init: true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OPENCLAW_BIND_LAN: "1"
      TZ: Europe/London
    volumes:
      - openclaw-data:/home/node/.openclaw
    command:
      - bash
      - entrypoint.sh
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.aigentic-ai.co.uk
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.aigentic-ai.co.uk/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Europe/London
      TZ: Europe/London
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  openclaw-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/openclaw/data
  n8n-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/openclaw/n8n
  caddy-data:
  caddy-config:
