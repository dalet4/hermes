services:
  openclaw-gateway:
    image: ghcr.io/dalet4/openclaw:latest
    restart: unless-stopped
    init: true
    ports:
      - "18789:18789"
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OPENCLAW_BIND_LAN: "1"
      TZ: Europe/London
    volumes:
      - openclaw-data:/home/node/.openclaw
    command:
      - bash
      - entrypoint.sh
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  openclaw-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/openclaw/data
